<body>
    <input type="text" id="inp">
    <button id="btn">Store</button>
    <script>
        
          btn.addEventListener('click',()=>{
               let data=document.getElementById('inp').value
               //localStorage.setItem("name","ankitâ")
                 let c=JSON.parse(localStorage.getItem("name"))||[];
                  c.push(data)
                  console.log(c);
                  let a=JSON.stringify(c);
                  localStorage.setItem("name",a);
          })
