
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add(){
         var a= parseInt(document.getElementById("num1").value);
          var b= parseInt(document.getElementById("num2").value);
          document.getElementById("res").innerHTML="Sum is " +(a+b);
        }
        function sub(){
         var a= parseInt(document.getElementById("num1").value);
          var b= parseInt(document.getElementById("num2").value);
          document.getElementById("res").innerHTML="Sub is " +(a-b);
        }
        function mult(){
         var a= parseInt(document.getElementById("num1").value);
          var b= parseInt(document.getElementById("num2").value);
          document.getElementById("res").innerHTML="mult is " +(a*b);
        }
       
        function div(){
         var a= parseInt(document.getElementById("num1").value);
          var b= parseInt(document.getElementById("num2").value);
          document.getElementById("res").innerHTML="Div is " +(a/b);
        }
    </script>
</head>
<body>
    <P>Enter a first number</P>
    <input type="text" id="num1" placeholder="Frist number">
     <P>Enter a second number</P>
    <input type="text" id="num2" placeholder="Second number">
</br>
</br>
    <button onclick="add()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="mult()">X</button>
    <button onclick="div()">/</button>
    </br>
</br>
<p id="res">Sum is :2</p>
</body>
</html>
