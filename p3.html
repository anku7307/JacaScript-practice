<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
         function demo(){
            var a= document.getElementById("p2").value;
            if(a=="Ankita"){
                document.getElementById("res").innerHTML="Hello Boss" +a;
            }
          else{
            alert(' invalid Input ');
          }
         }
        
    </script>
</head>
<body>
    <input type="text" id="p2" placeholder="Enter name">
    <button onclick="demo()">Check</button>
    <p id="res"></p>
</body>
</html>
